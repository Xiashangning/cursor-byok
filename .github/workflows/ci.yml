name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cursor-cli:
    name: Cursor CLI launcher (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test isolated CLI setup
        run: node --test support/cursor-cli/launcher.test.cjs

  rust:
    name: Rust (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The workspace includes apps/desktop/src-tauri, so even `cargo check`
      # needs the same system libraries the release workflow installs.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - uses: actions/setup-go@v5
        with:
          go-version-file: support/cursor-protocol-extractor/go.mod

      - name: Verify cursor protocol extractor
        working-directory: support/cursor-protocol-extractor
        run: go test ./...

      - name: Generate and compile protocol consumers
        run: |
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash support/cursor-protocol-extractor/scripts/generate.sh
          (cd support/cursor-protocol-extractor && go test ./gen/...)
          (cd support/cursor-capture && go test ./...)

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check types and production build
        working-directory: apps/desktop
        run: npm run check

  desktop-rust:
    name: Desktop Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Run platform Clippy
        run: cargo clippy --package cursor-byok-desktop --all-targets -- -D warnings

      - name: Run platform tests
        run: cargo test --package cursor-byok-desktop
